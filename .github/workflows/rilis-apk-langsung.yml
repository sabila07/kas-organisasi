name: Rilis APK Kas Organisasi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bangun APK
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Siapkan nama APK
        run: |
          APK="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" Kas-Organisasi.apk

      - name: Terbitkan APK untuk unduhan langsung
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          gh release create latest Kas-Organisasi.apk \
            --title "Kas Organisasi - APK terbaru" \
            --notes "APK siap instal Android. Dibangun otomatis dari branch main." \
            --latest
