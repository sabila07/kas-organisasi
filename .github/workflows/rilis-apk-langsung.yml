name: Rilis APK Kas Organisasi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Izinkan menjalankan Gradle
        run: chmod +x ./gradlew

      - name: Bangun APK debug
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Siapkan file APK langsung
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Kas-Organisasi.apk
          ls -lh Kas-Organisasi.apk

      - name: Simpan APK debug sebagai artefak cadangan
        uses: actions/upload-artifact@v4
        with:
          name: Kas-Organisasi-debug-APK
          path: Kas-Organisasi.apk
          if-no-files-found: error
          retention-days: 14

      - name: Terbitkan file APK untuk unduhan langsung
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Kas-Organisasi.apk --clobber
          else
            gh release create latest Kas-Organisasi.apk \
              --title "Kas Organisasi - APK debug terbaru" \
              --notes "APK debug siap dipasang di Android. Dibangun otomatis dari branch main." \
              --latest
          fi
